services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: inventory-app-php
    working_dir: /var/www
    volumes:
      - .:/var/www
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=inventory_db
      - DB_USERNAME=root
      - DB_PASSWORD=1234
    depends_on:
      - mysql

  nginx:
    image: nginx:alpine
    container_name: inventory-app-nginx
    ports:
      - "9091:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  mysql:
    image: mysql:8.4.10
    container_name: inventory-app-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: inventory_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/2-seed.sql

volumes:
  mysql_data:
