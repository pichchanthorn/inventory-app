server {
    listen 80;
    server_name localhost;

    root /var/www;
    index index.php index.html;

    fastcgi_buffers 16 16k;
    fastcgi_buffer_size 32k;

    # ================================================
    # Phase K2-E - minimal HTTP security headers.
    #
    # `always` makes these attach to error responses too (403/404/etc),
    # not just 2xx/3xx - deliberately so the K1 deny rules below still
    # carry them. Deliberately NOT Content-Security-Policy or
    # Strict-Transport-Security: this app loads Bootstrap/html5-qrcode
    # from a CDN and uses inline <script> for the theme/language toggle,
    # so a real CSP needs nonces/hashes (a project, not a one-line add);
    # and both shipped deployments are plain HTTP (this file listens on
    # :80), so HSTS on an HTTP origin is simply ignored by browsers and
    # would be a footgun the day someone tests a self-signed cert.
    #
    # settings/index.php ALSO sets X-Content-Type-Options itself on the
    # backup download response - that PHP-level header and this
    # server-level one can both appear on that one response, which is
    # harmless (browsers accept the duplicate) and left as-is rather
    # than special-cased here.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    # ================================================
    # Phase K1 - web boundary.
    #
    # The document root is the repository root (see docker-compose.yml's
    # `.:/var/www` mount), which is the layout this application is built
    # for - config/base_url.php derives BASE_URL by subtracting the
    # document root from the repository path, so a public/-only root
    # would break every generated URL. K1 therefore keeps that layout and
    # adds access rules instead of moving files.
    #
    # Without these rules, anything that is not a .php file falls through
    # `location /`'s try_files and is served as a static download - that
    # included database/schema.sql, database/seed.sql, all 17 migrations,
    # every .md, composer.json, phpunit.xml.dist, docker-compose.yml and,
    # on a git-cloned deployment, the whole .git/ directory.
    #
    # These blocks are deliberately placed BEFORE `location ~ \.php$`.
    # The `^~` prefix blocks additionally stop Nginx from evaluating any
    # regex location at all once they match, so nothing inside a denied
    # directory can be re-exposed by the PHP handler below.
    # ================================================

    # Dotfiles and dot-directories at any depth: .git/, .github/,
    # .gitignore, and anything similar added later.
    location ~ /\. {
        deny all;
    }

    # Repository directories that are never part of the public surface.
    # Verified against the current tree: none of these contains a page
    # the application links to. `audit/` is deliberately NOT listed - it
    # is the Admin-only Audit Log page (audit/index.php, linked from
    # includes/header.php), not repository metadata.
    location ^~ /database/ { deny all; }
    location ^~ /tests/    { deny all; }
    location ^~ /docs/     { deny all; }
    location ^~ /docker/   { deny all; }
    location ^~ /vendor/   { deny all; }

    # Repository metadata and data files, at any depth.
    #
    # Blocking *.sql does NOT affect the application's own backup
    # download: that is produced by settings/index.php (an authenticated,
    # Admin-only, CSRF-verified POST) which streams the dump through PHP
    # and only names the file *.sql in a Content-Disposition header. No
    # .sql URL is ever requested, so no rule here applies to it.
    location ~* \.(sql|md|dist|yml|yaml|cmd|lock)$ {
        deny all;
    }
    location = /composer.json {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www$fastcgi_script_name;
    }
}
