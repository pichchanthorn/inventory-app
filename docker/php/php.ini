; ================================================
; Phase K2-E - production-oriented PHP settings for the shipped Docker
; image ONLY. Does not touch XAMPP/Laragon, which ship and manage their
; own php.ini for local development.
;
; docker/php/Dockerfile ships no php.ini at all today, so this container
; runs on PHP's compiled defaults: display_errors=1, display_startup_errors=1
; and log_errors=0 (verified: `php -n -r 'echo ini_get(...)'` on this PHP
; build). That means, unmodified, any warning/notice/uncaught exception
; in the Docker deployment renders into the HTTP response a visitor sees
; and is written nowhere - the opposite of what a production deployment
; needs. This file is placed in PHP's conf.d scan directory
; (see docker/php/Dockerfile), so it is layered on top of the image's
; own php.ini-production without replacing it - only the five settings
; below are touched.
; ================================================

display_errors = Off
display_startup_errors = Off
log_errors = On

; /proc/self/fd/2 is the running process's own stderr, which is what
; `docker logs` reads from a container's PID 1. php-fpm's own error_log
; directive independently targets stderr in the official image's
; entrypoint, but this setting governs PHP's OWN error_log() calls/
; runtime errors specifically (including the error_log() call added to
; config/db.php in this same phase), so it is set explicitly here rather
; than assumed.
error_log = /proc/self/fd/2

; Removes the "X-Powered-By: PHP/8.4.19" response header, which
; otherwise discloses the exact PHP version to anyone.
expose_php = Off
